<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>照片快筛 · 动效工具预览</title><link rel="icon" href="data:,"><link rel="stylesheet" href="/style.css"><main><header><h1>照片快筛 · 动效工具预览</h1><p>独立开发工具，不随桌面应用启动。照片与文字保持清晰，渐进模糊仅作用于控件材质。</p></header><section class="material"><h2>玻璃材质</h2><div class="glass"><div class="reflection" aria-hidden="true"></div><button id="morph" aria-label="切换图标"><svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2"/></svg></button><span>保留</span><button id="move">预览动效</button></div><p>上沿清晰，反光向下逐渐扩散。移动与图标动效由按钮触发。</p></section><section class="tools"><article><h2>Lottie</h2><div id="lottie" aria-label="矢量动效预览"></div><button id="play-lottie">播放一次</button></article><article><h2>Theatre.js</h2><div class="track"><div id="theatre-marker"></div></div><label for="timeline">时间轴</label><input id="timeline" type="range" min="0" max="1" step=".01" value="0"><button id="studio">打开编辑器</button></article><article><h2>Postprocessing</h2><canvas id="scene" aria-label="独立三维材质预览"></canvas><button id="render">预览后期处理</button></article></section><p id="status" role="status">正在验证依赖…</p></main><script type="module" src="/main.mjs"></script></html>
