name: Build and release Windows APP
on:
  push:
    branches: [main]
  # Pull requests get the full Windows build and checks; only main publishes.
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install native dependencies
        run: python -m pip install -r requirements-desktop.txt 'pyinstaller>=6,<7'
      - name: Test library and updater
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test native interface, held keys and decoder processes
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/desktop_check.py
      - name: Test update UI idle and restart behavior
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_update_ui.py
      - name: Verify actual native Windows window frame and snapping support
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_windows_chrome.py
      - name: Open and screenshot every application interface
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_all_screens.py --output ui-screenshots-ci
      - name: Verify folder picker avoids RAW shell extensions
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_folder_icons.py --output folder-icons-ci.json
      - name: Verify 10 RAW import and full-resolution isolated decoding
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_large_import.py --photos 10 --output large-import-10-ci.json
      - name: Verify 16000 RAW import, real progress and bounded preloading
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_large_import.py --photos 16000 --output large-import-16000-ci.json
      - name: Verify native D3D11 compositor with RAW import and zoom
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_large_import.py --photos 10 --mode gpu --output large-import-gpu-ci.json
      - name: Retain interface diagnostics even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-interface-diagnostics
          path: |
            windows-chrome-ci.json
            ui-screenshots-ci/*
            folder-icons-ci.json
            large-import-*-ci.*
            large-import-*-ci-*.png
            large-import-*-ci-logs/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Audit paging, review performance and cache limits
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_performance.py --output performance-ci.json
      - name: Build native EXE
        run: python -m PyInstaller --noconfirm --clean photo-sieve.spec
      - name: Verify normal frozen startup, real folder picker and repeated RAW switches
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_frozen_runtime.py --output frozen-runtime-ci.json
      - name: Preserve normal frozen runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-normal-runtime-diagnostics
          path: |
            frozen-runtime-ci.json
            frozen-runtime-ci-*.png
            frozen-runtime-ci-logs/**
          if-no-files-found: ignore
          retention-days: 14
      - name: Create update package and checksums
        run: python package_release.py
      - name: Build Windows installer with selectable installation folder
        shell: pwsh
        run: |
          python -c "from zipfile import ZipFile; ZipFile('release/PhotoSieve-Windows-x64.zip').extractall('dist/install-payload')"
          $version = python -c 'from version import APP_VERSION; print(APP_VERSION)'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $hash = (Get-FileHash release/PhotoSieve-Setup-Windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          Add-Content release/SHA256SUMS.txt "$hash  PhotoSieve-Setup-Windows-x64.exe"
      - name: Verify installation at a chosen path and workspace preservation
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_installer.py
      - name: Verify packaged APP
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--self-test-output', 'frozen-diagnostics-ci.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged APP diagnostics failed' }
          if (!(Get-Content frozen-diagnostics-ci.json -Raw | ConvertFrom-Json).ok) { throw 'Diagnostics did not pass' }
          python tools/check_frozen_update.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen updater integration failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSieve-Windows-x64
          path: |
            release/*
            frozen-diagnostics-ci.json
            windows-chrome-ci.json
            performance-ci.json
            ui-screenshots-ci/*
            ui-screenshots-windows/*
          retention-days: 14
      - name: Publish a new version to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = python -c 'from version import APP_VERSION; print(APP_VERSION)'
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Version $tag already published. Bump APP_VERSION to release the next update."
            exit 0
          }
          gh release create $tag release/PhotoSieve-Windows-x64.zip release/PhotoSieve-Setup-Windows-x64.exe release/update.json release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "照片快筛 $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
