name: Build and release Windows APP
on:
  push:
    branches: [main]
  # Pull requests get the full Windows build and checks; only main publishes.
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      checks:
        description: Validation scope
        type: choice
        default: full
        options: [full, update_ui, features, review_ui, zoom_ui, deletion, responsiveness, cache_ui]
permissions:
  contents: write
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    if: ${{ !contains(github.event.head_commit.message, '[tests-only]') }}
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
      CHECK_SCOPE: ${{ inputs.checks || (contains(github.event.head_commit.message, '[checks:cache-ui]') && 'cache_ui') || (contains(github.event.head_commit.message, '[checks:responsiveness]') && 'responsiveness') || (contains(github.event.head_commit.message, '[checks:deletion]') && 'deletion') || (contains(github.event.head_commit.message, '[checks:zoom-ui]') && 'zoom_ui') || (contains(github.event.head_commit.message, '[checks:review-ui]') && 'review_ui') || (contains(github.event.head_commit.message, '[checks:features]') && 'features') || (contains(github.event.head_commit.message, '[checks:update-ui]') && 'update_ui') || 'full' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install native dependencies
        run: python -m pip install -r requirements-desktop.txt 'pyinstaller>=6,<7'
      - name: Prepare verified offline ARW metadata runtime
        run: python tools/prepare_exiftool.py
      - name: Prepare public verification photos
        if: env.CHECK_SCOPE == 'features' || env.CHECK_SCOPE == 'responsiveness' || env.CHECK_SCOPE == 'cache_ui' || env.CHECK_SCOPE == 'review_ui'
        run: python tools/prepare_feature_fixtures.py
      - name: Test changed face, cache and rating components
        if: env.CHECK_SCOPE == 'features'
        env:
          QT_QPA_PLATFORM: offscreen
          PHOTOSIEVE_FACE_SAMPLE: feature-fixtures/astronaut.png
        run: python -m unittest tests.test_faces tests.test_face_service tests.test_cache_index tests.test_capacity_cache tests.test_face_cache_policy tests.test_ratings tests.test_embedded_rating -v
      - name: Verify real Sony ARW embedded stars and unchanged sensor data
        if: env.CHECK_SCOPE == 'features'
        run: python tools/check_arw_rating.py feature-fixtures/sony.ARW arw-rating-ci
      - name: Open changed dialogs and album interfaces
        if: env.CHECK_SCOPE == 'features'
        env:
          QT_QPA_PLATFORM: windows
          PHOTOSIEVE_FACE_SAMPLE: feature-fixtures/astronaut.png
        run: |
          python tools/check_small_dialogs.py --output small-dialogs-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_features.py --output features-ui-ci
      - name: Verify affected interfaces at 150 percent scaling
        if: env.CHECK_SCOPE == 'features'
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
          PHOTOSIEVE_FACE_SAMPLE: feature-fixtures/astronaut.png
        run: python tools/check_features.py --output features-hidpi-ci
      - name: Test only zoom, repeated clicks and album return animation
        if: env.CHECK_SCOPE == 'zoom_ui'
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -m unittest tests.test_zoom tests.test_zoom_interaction tests.test_album_navigation tests.test_motion -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_zoom_motion.py zoom-ui-ci
      - name: Verify zoom interactions at 150 percent scaling
        if: env.CHECK_SCOPE == 'zoom_ui'
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
        run: python tools/check_zoom_motion.py zoom-hidpi-ci
      - name: Verify only changed review header
        if: env.CHECK_SCOPE == 'review_ui'
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -m unittest tests.test_photo_metadata tests.test_metadata_service tests.test_next_preview tests.test_preview_resolution tests.test_delete_sharing tests.test_mode_settings tests.test_album_navigation tests.test_zoom tests.test_operation_audit.OperationAuditTest.test_restore_all_deleted_includes_photos_beyond_loaded_page tests.test_operation_audit.OperationAuditTest.test_deselect_after_select_all_is_preserved_when_next_page_loads tests.test_operation_audit.OperationAuditTest.test_restore_selected_restores_only_selected_photos -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_review_details.py review-ui-ci feature-fixtures/sony.ARW
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_mode_settings.py mode-settings-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_deleted_album.py deleted-album-ci
      - name: Verify changed review header at 150 percent scaling
        if: env.CHECK_SCOPE == 'review_ui'
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
        run: python tools/check_review_details.py review-hidpi-ci feature-fixtures/sony.ARW
      - name: Test metadata sharing and rapid deletion
        if: env.CHECK_SCOPE == 'deletion'
        env:
          QT_QPA_PLATFORM: windows
        run: |
          python -m unittest tests.test_delete_sharing tests.test_photo_metadata -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_fast_delete.py deletion-ui-ci
      - name: Test changed responsiveness and file coordination
        if: env.CHECK_SCOPE == 'responsiveness'
        env:
          QT_QPA_PLATFORM: windows
          PHOTOSIEVE_FACE_SAMPLE: feature-fixtures/astronaut.png
        run: |
          python -m unittest tests.test_faces tests.test_face_service tests.test_metadata_service tests.test_photo_metadata tests.test_delete_sharing tests.test_cache_plan tests.test_cache_index tests.test_capacity_cache tests.test_face_cache_policy tests.test_update_schedule -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_review_details.py review-ui-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_update_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_cache_settings.py cache-ui-ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_fast_delete.py deletion-ui-ci --count 500 --raw-fixture feature-fixtures/sony.ARW
      - name: Verify only changed cache dialog and cleanup entry
        if: env.CHECK_SCOPE == 'cache_ui'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_cache_settings.py cache-ui-ci
      - name: Verify cache dialog at 150 percent scaling
        if: env.CHECK_SCOPE == 'cache_ui'
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
        run: python tools/check_cache_settings.py cache-hidpi-ci
      - name: Test library and updater
        if: env.CHECK_SCOPE == 'full'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test native interface, held keys and decoder processes
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/desktop_check.py
      - name: Test real Windows ratings and independent grading interface
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_ratings.py ratings-ui-ci
      - name: Verify grading at 150 percent Windows display scaling
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
        run: python tools/check_ratings.py ratings-hidpi-ci
      - name: Test update UI idle and restart behavior
        if: env.CHECK_SCOPE == 'full' || env.CHECK_SCOPE == 'update_ui'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_update_ui.py
      - name: Verify changed update offer layout and interactions
        if: env.CHECK_SCOPE == 'update_ui'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_update_offer.py update-offer-ci
      - name: Verify changed offer at 150 percent display scaling
        if: env.CHECK_SCOPE == 'update_ui'
        env:
          QT_QPA_PLATFORM: windows
          QT_SCALE_FACTOR: '1.5'
        run: python tools/check_update_offer.py update-offer-hidpi-ci
      - name: Verify actual native Windows window frame and snapping support
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_windows_chrome.py
      - name: Open and screenshot every application interface
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_all_screens.py --output ui-screenshots-ci
      - name: Verify folder picker avoids RAW shell extensions
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_folder_icons.py --output folder-icons-ci.json
      - name: Verify 10 RAW import and full-resolution isolated decoding
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_large_import.py --photos 10 --output large-import-10-ci.json
      - name: Verify 16000 RAW import, real progress and bounded preloading
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_large_import.py --photos 16000 --output large-import-16000-ci.json
      - name: Verify native D3D11 compositor with RAW import and zoom
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_large_import.py --photos 10 --mode gpu --output large-import-gpu-ci.json
      - name: Retain interface diagnostics even if a check fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-interface-diagnostics
          path: |
            windows-chrome-ci.json
            ui-screenshots-ci/*
            ratings-ui-ci/*
            ratings-hidpi-ci/*
            folder-icons-ci.json
            large-import-*-ci.*
            large-import-*-ci-*.png
            large-import-*-ci-logs/**
            update-offer-ci/*
            update-offer-hidpi-ci/*
            features-ui-ci/*
            features-hidpi-ci/*
            small-dialogs-ci/*
            arw-rating-ci/*
            zoom-ui-ci/*
            zoom-hidpi-ci/*
            review-ui-ci/*
            mode-settings-ci/*
            deleted-album-ci/*
            review-hidpi-ci/*
            deletion-ui-ci/*
            cache-ui-ci/*
            cache-hidpi-ci/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Audit paging, review performance and cache limits
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_performance.py --output performance-ci.json
      - name: Build native EXE
        run: python -m PyInstaller --noconfirm --clean photo-sieve.spec
      - name: Verify changed offer in packaged EXE
        if: env.CHECK_SCOPE == 'update_ui'
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--update-offer-self-test', 'frozen-update-offer-ci' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged update offer checks failed' }
          if (!(Get-Content frozen-update-offer-ci/report.json -Raw | ConvertFrom-Json).ok) { throw 'Update offer verification failed' }
      - name: Verify packaged face model, albums and ARW metadata runtime
        if: env.CHECK_SCOPE == 'features'
        env:
          QT_QPA_PLATFORM: windows
          PHOTOSIEVE_FACE_SAMPLE: feature-fixtures/astronaut.png
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--features-self-test', 'features-frozen-ci' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged feature checks failed' }
          if (!(Get-Content features-frozen-ci/report.json -Raw | ConvertFrom-Json).ok) { throw 'Packaged feature verification failed' }
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--arw-self-test', 'feature-fixtures/sony.ARW', 'arw-rating-frozen-ci' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged ARW verification failed' }
      - name: Verify zoom and album motion in packaged EXE
        if: env.CHECK_SCOPE == 'zoom_ui'
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--zoom-motion-self-test', 'zoom-frozen-ci' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Get-Content zoom-frozen-ci/report.json -Raw | ConvertFrom-Json).ok) { throw 'Packaged zoom motion failed' }
      - name: Verify changed review header in packaged EXE
        if: env.CHECK_SCOPE == 'review_ui'
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--review-ui-self-test', 'review-frozen-ci', 'feature-fixtures/sony.ARW' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged review header checks failed' }
          if (!(Get-Content review-frozen-ci/report.json -Raw | ConvertFrom-Json).ok) { throw 'Review header verification failed' }
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--mode-settings-self-test', 'mode-frozen-ci' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Get-Content mode-frozen-ci/report.json -Raw | ConvertFrom-Json).ok) { throw 'Packaged independent settings failed' }
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--deleted-album-self-test', 'deleted-frozen-ci' -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Get-Content deleted-frozen-ci/report.json -Raw | ConvertFrom-Json).ok) { throw 'Packaged deleted album failed' }
      - name: Verify cache settings in packaged EXE
        if: env.CHECK_SCOPE == 'cache_ui'
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--cache-settings-self-test', 'cache-frozen-ci' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged cache settings failed' }
          if (!(Get-Content cache-frozen-ci/report.json -Raw | ConvertFrom-Json).ok) { throw 'Packaged cache settings verification failed' }
      - name: Verify rapid deletion in packaged EXE
        if: env.CHECK_SCOPE == 'deletion' || env.CHECK_SCOPE == 'responsiveness' || env.CHECK_SCOPE == 'cache_ui'
        env:
          QT_QPA_PLATFORM: windows
        shell: pwsh
        run: |
          $arguments = @('--delete-sharing-self-test', 'deletion-frozen-ci')
          if ($env:CHECK_SCOPE -ne 'deletion') { $arguments += @('500', 'feature-fixtures/sony.ARW') }
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList $arguments -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged concurrent deletion failed' }
          if (!(Get-Content deletion-frozen-ci/report.json -Raw | ConvertFrom-Json).ok) { throw 'Packaged concurrent deletion verification failed' }
      - name: Verify frozen isolated Windows rating helpers
        if: env.CHECK_SCOPE == 'full'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--rating-self-test', 'frozen-ratings-ci.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Frozen system ratings failed' }
          if (!(Get-Content frozen-ratings-ci.json -Raw | ConvertFrom-Json).ok) { throw 'Frozen ratings verification failed' }
      - name: Verify normal frozen startup, real folder picker and repeated RAW switches
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: windows
        run: python tools/check_frozen_runtime.py --output frozen-runtime-ci.json
      - name: Preserve normal frozen runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-normal-runtime-diagnostics
          path: |
            frozen-ratings-ci.json
            frozen-runtime-ci.json
            frozen-runtime-ci-*.png
            frozen-runtime-ci-logs/**
            frozen-update-offer-ci/*
            features-frozen-ci/*
            arw-rating-frozen-ci/*
            zoom-frozen-ci/*
            review-frozen-ci/*
            mode-frozen-ci/*
            deleted-frozen-ci/*
            deletion-frozen-ci/*
          if-no-files-found: ignore
          retention-days: 14
      - name: Create update package and checksums
        run: python package_release.py
      - name: Build Windows installer with selectable installation folder
        shell: pwsh
        run: |
          python -c "from zipfile import ZipFile; ZipFile('release/PhotoSieve-Windows-x64.zip').extractall('dist/install-payload')"
          $version = python -c 'from version import APP_VERSION; print(APP_VERSION)'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { choco install innosetup --yes --no-progress; if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' } }
          & $iscc "/DAppVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          $hash = (Get-FileHash release/PhotoSieve-Setup-Windows-x64.exe -Algorithm SHA256).Hash.ToLower()
          Add-Content release/SHA256SUMS.txt "$hash  PhotoSieve-Setup-Windows-x64.exe"
      - name: Verify installation at a chosen path and workspace preservation
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tools/check_installer.py
      - name: Verify packaged APP
        if: env.CHECK_SCOPE == 'full'
        env:
          QT_QPA_PLATFORM: offscreen
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/PhotoSieve/PhotoSieve.exe -ArgumentList '--self-test-output', 'frozen-diagnostics-ci.json' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Packaged APP diagnostics failed' }
          if (!(Get-Content frozen-diagnostics-ci.json -Raw | ConvertFrom-Json).ok) { throw 'Diagnostics did not pass' }
          python tools/check_frozen_update.py
          if ($LASTEXITCODE -ne 0) { throw 'Frozen updater integration failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSieve-Windows-x64
          path: |
            release/*
            frozen-diagnostics-ci.json
            windows-chrome-ci.json
            performance-ci.json
            ui-screenshots-ci/*
            ratings-ui-ci/*
            ratings-hidpi-ci/*
            ui-screenshots-windows/*
          retention-days: 14
      - name: Publish a new version to GitHub Releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $version = python -c 'from version import APP_VERSION; print(APP_VERSION)'
          $tag = "v$version"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Output "Version $tag already published. Bump APP_VERSION to release the next update."
            exit 0
          }
          gh release create $tag release/PhotoSieve-Windows-x64.zip release/PhotoSieve-Setup-Windows-x64.exe release/update.json release/SHA256SUMS.txt --target $env:GITHUB_SHA --title "照片快筛 $version" --notes-file RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
