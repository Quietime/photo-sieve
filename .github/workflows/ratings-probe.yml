name: Probe Windows system photo ratings
on:
  push:
    branches: [feature/windows-ratings]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow pywin32
      - run: python tools/probe_windows_ratings.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Windows-rating-probe
          path: windows-rating-probe.json
